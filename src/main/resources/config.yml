# RW Restart Server
# Messages use MiniMessage format. <seconds> = seconds remaining.

# How many seconds players are warned before the server stops.
countdown-seconds: 50

# If true and nobody is online, stop immediately without waiting.
skip-if-empty: false

# Typing "stop now" skips the countdown (emergency use).
bypass-argument: now

# Commands that start the countdown instead of stopping right away.
intercepted-commands:
  - stop
  - restart

# Small chat text: OFF (only the big title is used).
chat:
  enabled: false
  at: [50, 30, 10, 5, 3, 2, 1]

# Small text above the hotbar: OFF.
actionbar:
  enabled: false

# Big animated title in the middle of the screen, from the start (50).
# speed = how fast the colors run back and forth (bigger = faster).
title:
  enabled: true
  from: 50
  speed: 0.35
  # From this many seconds left, the colors turn red.
  danger-from: 10

# Sound played every second once remaining <= from.
sound:
  enabled: true
  from: 10
  name: block.note_block.pling
  volume: 1.0
  pitch: 1.0

messages:
  chat: "<yellow>[Server] Restarting in <red><seconds></red> seconds."
  actionbar: "<red>Server restarting in <seconds>s"
  title: "<bold><gradient:#00e676:#ffffff:#00e676:{phase}>« RESTART SERVER »</gradient></bold>"
  subtitle: "<bar> <gradient:#ffffff:#00e676:#ffffff:{phase}><bold><seconds></bold> seconds</gradient>"
  title-danger: "<bold><gradient:#ff3d3d:#ffffff:#ff3d3d:{phase}>« RESTART SERVER »</gradient></bold>"
  subtitle-danger: "<bar> <gradient:#ffffff:#ff3d3d:#ffffff:{phase}><bold><seconds></bold> seconds</gradient>"
  kick: "<gradient:#f6d365:#fda085><bold>Panda MC is restarting.</bold></gradient>\n<gray>Please rejoin in a moment."
  cancelled: "<green>[Server] Restart cancelled."
  already-running: "<red>A restart countdown is already running. Use /cancelrestart to cancel it."
  not-running: "<red>No restart countdown is running."
